```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Finance Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        /* HEADER */

        .header {
            background: #0f172a;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        /* CONTAINER */

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 20px;
        }

        /* BUTTONS */

        .buttons {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }

        .incomeBtn {
            background: #16a34a;
        }

        .expenseBtn {
            background: #dc2626;
        }

        .debitBtn {
            background: #ea580c;
        }

        .payBtn {
            background: #2563eb;
        }

        /* DASHBOARD */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 26px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .debit {
            color: #ea580c;
        }

        .balance {
            color: #2563eb;
        }

        /* SECTION */

        .section {
            background: white;
            margin-top: 20px;
            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 15px;
        }

        /* ALLOCATION */

        .allocation {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 12px;
        }

        .allocation div {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
        }

        .allocation strong {
            display: block;
            margin-top: 8px;
            font-size: 20px;
        }

        /* INFO */

        .info {
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
        }

        /* MOBILE */

        @media(max-width:600px) {

            .header h1 {
                font-size: 23px;
            }

            .container {
                padding: 12px;
            }

            .amount {
                font-size: 22px;
            }

        }

    </style>

</hea
