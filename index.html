```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Finance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 25px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .debit {
            color: #ea580c;
        }

        .balance {
            color: #2563eb;
        }

        .section {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .allocation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .allocation div {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }

        .allocation strong {
            display: block;
            margin-top: 7px;
            font-size: 20px;
        }

        @media(max-width:600px) {
            .header h1 {
                font-size: 22px;
            }

            .amount {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>My Finance Tracker</h1>
    <p>Income • Expenses • Debit • Credit</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Income</h3>
            <div class="amount income">₹0</div>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <div class="amount expense">₹0</div>
        </div>

        <div class="card">
            <h3>Debit Balance</h3>
            <div class="amount debit">₹0</div>
        </div>

        <div class="card">
            <h3>Available Balance</h3>
            <div class="amount balance">₹0</div>
        </div>

    </div>

    <div class="section">

        <h2>Income Allocation</h2>

        <div class="allocation">

            <div>
                Personal
                <strong>30%</strong>
            </div>

            <div>
                Emergency
                <strong>20%</strong>
            </div>

            <div>
                Savings
                <strong>20%</strong>
            </div>

            <div>
                PPF
                <strong>20%</strong>
            </div>

            <div>
                Jar
                <strong>10%</strong>
            </div>

        </div>

    </div>

</div>

</body>
</html>
