
name: Build Finance Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          mkdir -p apk-project/www
          cp index.html app.js apk-project/www/
          cd apk-project
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "My Finance Tracker" "com.clicksolutions.financetracker" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd apk-project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-Tracker-APK
          path: apk-project/android/app/build/outputs/apk/debug/app-debug.apk
