<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Finance Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }

        .incomeBtn {
            background: #16a34a;
        }

        .expenseBtn {
            background: #dc2626;
        }

        .debitBtn {
            background: #ea580c;
        }

        .payBtn {
            background: #2563eb;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 26px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .debit {
            color: #ea580c;
        }

        .balance {
            color: #2563eb;
        }

        .section {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .allocation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .allocation div {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
        }

        .allocation strong {
            display: block;
            margin-top: 8px;
            font-size: 20px;
        }

        .info {
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
        }

        @media(max-width:600px) {

            .header h1 {
                font-size: 23px;
            }

            .container {
                padding: 12px;
            }

            .amount {
                font-size: 22px;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <h1>My Finance Tracker</h1>

    <p>Income • Expenses • Debit • Credit</p>

</header>

<div class="container">

    <div class="buttons">

        <button
            class="incomeBtn"
            onclick="addIncomePrompt()">
            + Add Income
        </button>

        <button
            class="expenseBtn"
            onclick="addExpensePrompt()">
            + Add Expense
        </button>

        <button
            class="debitBtn"
            onclick="addDebitPrompt()">
            + Add Debit
        </button>

        <button
            class="payBtn"
            onclick="payDebitPrompt()">
            💰 Pay Debit
        </button>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Income</h3>
            <div class="amount income">₹0</div>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <div class="amount expense">₹0</div>
        </div>

        <div class="card">
            <h3>Debit Outstanding</h3>
            <div class="amount debit">₹0</div>
        </div>

        <div class="card">
            <h3>Available Balance</h3>
            <div class="amount balance">₹0</div>
        </div>

    </div>

    <div class="section">

        <h2>💰 Income Allocation</h2>

        <div class="allocation">

            <div>
                Personal
                <strong>30%</strong>
            </div>

            <div>
                Emergency
                <strong>20%</strong>
            </div>

            <div>
                Savings
                <strong>20%</strong>
            </div>

            <div>
                PPF
                <strong>20%</strong>
            </div>

            <div>
                Jar
                <strong>10%</strong>
            </div>

        </div>

        <div class="info">
            Income will automatically be divided according to these percentages.
        </div>

    </div>

</div>

<script src="app.js"></script>

<script>

function addIncomePrompt() {

    const amount = prompt("Enter Income Amount:");

    if (amount !== null) {
        addIncome(amount);
    }

}

function addExpensePrompt() {

    const amount = prompt("Enter Expense Amount:");

    if (amount !== null) {
        addExpense(amount);
    }

}

function addDebitPrompt() {

    const amount = prompt("Enter Debit Amount:");

    if (amount !== null) {
        addDebit(amount);
    }

}

function payDebitPrompt() {

    const amount = prompt("Enter Paid Debit Amount:");

    if (amount !== null) {
        payDebit(amount);
    }

}

</script>

</body>

</html>
